name: Test, build and publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: explorer
          POSTGRES_USER: explorer
          POSTGRES_PASSWORD: explorer
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U explorer" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://explorer:explorer@localhost:5432/explorer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx tsx scripts/migrate.ts
      - run: npx tsx scripts/seed.ts
      - run: npm run build

  # One native build per CPU type: amd64 for most VMs, arm64 for Oracle Ampere / AWS Graviton.
  image:
    needs: test
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: echo "SHORT=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE }}:sha-${{ env.SHORT }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  # Join the two builds under one tag; Docker picks the right one on each VM.
  manifest:
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch tags
        run: |
          s=${GITHUB_SHA::7}
          tags="-t $IMAGE:sha-$s"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then tags="$tags -t $IMAGE:latest"; fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then tags="$tags -t $IMAGE:${GITHUB_REF_NAME#v}"; fi
          docker buildx imagetools create $tags $IMAGE:sha-$s-amd64 $IMAGE:sha-$s-arm64
          docker buildx imagetools inspect $IMAGE:sha-$s

  # Boot the published image on both CPU types against a real Postgres.
  smoke:
    needs: manifest
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    permissions:
      packages: read
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run image with Postgres
        run: |
          docker network create t
          docker run -d --name db --network t -e POSTGRES_DB=explorer -e POSTGRES_USER=explorer -e POSTGRES_PASSWORD=explorer postgres:16-alpine
          for i in $(seq 1 30); do docker exec db pg_isready -U explorer && break; sleep 2; done
          docker run -d --name app --network t -p 3000:3000 \
            -e DATABASE_URL=postgresql://explorer:explorer@db:5432/explorer \
            -e APP_URL=http://localhost:3000 \
            $IMAGE:sha-${GITHUB_SHA::7}
          for i in $(seq 1 30); do curl -fs localhost:3000/api/health && break; sleep 2; done
          docker exec app uname -m
          docker exec -e ADMIN_EMAIL=ci@example.com -e ADMIN_PASSWORD=ci-password-123 app node scripts/seed.cjs
          for p in / /explore /regions /partners /legal/terms /sitemap.xml /login /forgot-password; do
            code=$(curl -s -o /dev/null -w '%{http_code}' localhost:3000$p); echo "$code $p"; test "$code" = 200
          done
          docker exec app sh -c 'touch /data/uploads/.write-test && echo uploads writable'
          docker exec app node -e "require('sharp')({create:{width:10,height:10,channels:3,background:'#fff'}}).webp().toBuffer().then(b=>console.log('sharp ok',b.length))"
      - if: failure()
        run: docker logs app
