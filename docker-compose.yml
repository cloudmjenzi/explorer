# One-VM production stack: Caddy (automatic HTTPS) -> app -> Postgres, plus a daily cron and nightly DB backups.
# Usage:  cp .env.example .env  (fill it in)  then  docker compose up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: explorer
      POSTGRES_USER: explorer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U explorer"]
      interval: 10s
      retries: 10

  app:
    # Pre-built by GitHub Actions on every push to main. Falls back to building locally.
    image: ghcr.io/cloudmjenzi/explorer:${APP_TAG:-latest}
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://explorer:${POSTGRES_PASSWORD}@db:5432/explorer
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  cron:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in .env}
    # Every hour: expire unpaid holds, complete past trips, send review requests.
    entrypoint: ["/bin/sh", "-c", "while true; do curl -fsS -X POST -H \"Authorization: Bearer $$CRON_SECRET\" http://app:3000/api/cron/daily || true; echo; sleep 3600; done"]
    depends_on:
      - app

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
      - uploads:/uploads:ro
    # Nightly compressed dump plus uploads archive, keeping 14 days.
    entrypoint: ["/bin/sh", "-c", "while true; do d=$$(date +%F); pg_dump -h db -U explorer explorer | gzip > /backups/db-$$d.sql.gz; tar czf /backups/uploads-$$d.tgz -C /uploads . ; find /backups -type f -mtime +14 -delete; sleep 86400; done"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
